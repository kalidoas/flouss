<!DOCTYPE html>
<html lang="fr-MA" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Flouss - Suivi des finances personnelles, épargne et revenus au Maroc (MAD)" />
    
    <!-- Apple PWA tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flouss" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts: Plus Jakarta Sans, Inter & Cairo for Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Campus Wi-Fi & Legacy Browser Polyfills (iOS 14+, Safari 14, Android Chrome 80+) -->
    <script>
      (function() {
        try {
          if (typeof globalThis === 'undefined') {
            window.globalThis = window;
          }
          if (!Array.prototype.at) {
            Array.prototype.at = function(n) {
              n = Math.trunc(n) || 0;
              if (n < 0) n += this.length;
              if (n < 0 || n >= this.length) return undefined;
              return this[n];
            };
          }
          if (!String.prototype.at) {
            String.prototype.at = function(n) {
              n = Math.trunc(n) || 0;
              if (n < 0) n += this.length;
              if (n < 0 || n >= this.length) return undefined;
              return this[n];
            };
          }
          if (!Object.hasOwn) {
            Object.hasOwn = function(obj, prop) {
              return Object.prototype.hasOwnProperty.call(obj, prop);
            };
          }
          if (!Promise.allSettled) {
            Promise.allSettled = function(promises) {
              return Promise.all(
                promises.map(function(p) {
                  return Promise.resolve(p).then(
                    function(value) { return { status: 'fulfilled', value: value }; },
                    function(reason) { return { status: 'rejected', reason: reason }; }
                  );
                })
              );
            };
          }
          if (typeof queueMicrotask === 'undefined') {
            window.queueMicrotask = function(cb) {
              Promise.resolve().then(cb);
            };
          }
        } catch (e) {}
      })();
    </script>

    <!-- Theme Initialization Script (Prevents flash and ensures dark class on <html>) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('flouss_theme');
          var isDark = false;
          if (t === 'dark') {
            isDark = true;
          } else if (t === 'light') {
            isDark = false;
          } else {
            var raw = localStorage.getItem('flouss_app_storage_v2');
            if (raw) {
              var s = JSON.parse(raw);
              if (s && s.state) {
                if (s.state.theme === 'dark') isDark = true;
                else if (s.state.theme === 'light') isDark = false;
                else if (s.state.theme === 'system' || !s.state.theme) {
                  isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
              }
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              isDark = true;
            }
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <title>Flouss — Finances Personnelles (MAD)</title>
  </head>
  <body class="h-full bg-canvas text-content antialiased selection:bg-accent selection:text-white font-sans">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker registration and auto-update handling
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (let name of names) caches.delete(name);
            });
          }
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              reg.onupdatefound = function() {
                var installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = function() {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      window.location.reload();
                    }
                  };
                }
              };
            }).catch(function() {});
          });
        }
      }
    </script>
  </body>
</html>
